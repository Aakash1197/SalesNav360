server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/SALESNAV360}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

salesnav.auth.cookie-secure=${SALESNAV_COOKIE_SECURE:false}
salesnav.cors.allowed-origins=${SALESNAV_CORS_ALLOWED_ORIGINS:http://localhost:3000}
