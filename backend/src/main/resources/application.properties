spring.application.name=SalesNav360
spring.profiles.default=localhost

spring.sql.init.mode=never
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

salesnav.auth.jwt-secret=${SALESNAV_JWT_SECRET}
salesnav.auth.cookie-name=${SALESNAV_JWT_COOKIE_NAME:salesnav360}
salesnav.auth.jwt-expiration-seconds=${SALESNAV_JWT_EXPIRATION_SECONDS:3600}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
