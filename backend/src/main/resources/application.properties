spring.application.name=SalesNav360
spring.profiles.default=localhost

spring.sql.init.mode=never
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

salesnav.auth.jwt-secret=${SALESNAV_JWT_SECRET:salesnav360secret}
salesnav.auth.cookie-name=${SALESNAV_JWT_COOKIE_NAME:salesnav360}
salesnav.auth.jwt-expiration-seconds=${SALESNAV_JWT_EXPIRATION_SECONDS:3600}
salesnav.bootstrap.admin-username=${SALESNAV_BOOTSTRAP_ADMIN_USERNAME:admin}
salesnav.bootstrap.admin-email=${SALESNAV_BOOTSTRAP_ADMIN_EMAIL:aakayachougule@gmail.com}
salesnav.bootstrap.admin-password=${SALESNAV_BOOTSTRAP_ADMIN_PASSWORD:AakashChougule@123}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
